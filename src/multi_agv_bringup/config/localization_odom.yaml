# Unloaded equilateral-fixture localization. Values assume each stationary
# chassis odometry is reset to (0,0,0) after its turntable centre and heading
# are aligned to the floor marks documented in three-car-unloaded-fixture.md.
# They are not valid after a car is moved without repeating that reset.
localization_mode: odometry_pretest
configuration_status: unloaded_equilateral_fixture_pending_readonly_gate
hardware_execution_authorized: false

publish_rate: 100.0
maximum_state_age: 0.15
maximum_sync_slop: 0.02
synchronization_queue_size: 64
maximum_rigid_fit_residual: 0.01

projector:
  coarse_samples: 81
  maximum_refinement_iterations: 48
  convergence_tolerance: 1.0e-9
  maximum_projection_distance: 0.08

estimator:
  filter_alpha: 0.8
  projection_half_window: 0.35
  initial_progress: 0.0
  minimum_measurement_interval: 1.0e-5
  maximum_measurement_interval: 0.2
  maximum_absolute_speed: 0.5

robots:
  - robot_id: agv1
    robot_index: 1
    odom_topic: /agv1/odom
    odom_frame: agv1/odom
    base_frame: agv1/base_link
    world_to_odom: {x: 0.182252857360210, y: 0.057256423777858, yaw: 0.304395797364615}
    base_to_support: {x: -0.01783, y: 0.0, yaw: 0.0}
  - robot_id: agv2
    robot_index: 2
    odom_topic: /agv2/odom
    odom_frame: agv2/odom
    base_frame: agv2/base_link
    world_to_odom: {x: -0.222103903348248, y: 0.087452054972220, yaw: 0.304395797364615}
    base_to_support: {x: 0.09908, y: 0.0, yaw: 0.0}
  - robot_id: agv3
    robot_index: 3
    odom_topic: /agv3/odom
    odom_frame: agv3/odom
    base_frame: agv3/base_link
    world_to_odom: {x: -0.132188862271489, y: -0.198756409941319, yaw: 0.304395797364615}
    base_to_support: {x: 0.09908, y: 0.0, yaw: 0.0}
