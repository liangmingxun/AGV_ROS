# Task 15 software boundary. The three AGV tag-to-base_link transforms below
# are measured installation values. The load transform remains a disabled
# placeholder until the load marker height and extrinsics are measured.
localization_mode: fused
require_calibration_epoch: true
configuration_status: three_agv_tag_extrinsics_measured_load_pending_readonly
hardware_execution_authorized: false

publish_rate: 100.0
maximum_state_age: 0.15
maximum_sync_slop: 0.02
synchronization_queue_size: 64
maximum_rigid_fit_residual: 0.01
# A spatially valid virtual-load projection may be held only while the speed
# estimator re-synchronizes after asynchronous three-robot timestamp changes.
# Spatial projection failures and holds longer than 50 ms remain invalid.
maximum_load_path_transient_hold: 0.05
maximum_robot_path_transient_hold: 0.05
load_pose_topic: /pose_provider/load/pose_filtered

camera_adapter:
  calibration_authorized: false
  # All enabled streams below have measured and frozen tag-to-base transforms.
  # The unresolved load stream remains present in the protocol but disabled.
  extrinsics_frozen: true
  world_frame: world
  maximum_input_age: 0.15
  maximum_future_offset: 0.02
  minimum_confidence: 0.5
  require_confidence: true
  # Filled by the UDP bridge as PoseStamped.frame_id world@xxxxxxxx. A change means that
  # world_T_camera was re-solved and all causal filters must restart.
  require_calibration_epoch: true
  # Causal first-order filtering only; no future samples or zero-phase pass.
  filter_alpha: 0.7
  streams:
    - entity_id: agv1
      enabled: true
      input_topic: /camera/world/agv1_tag_pose
      confidence_topic: /camera/world/agv1_confidence
      raw_output_topic: /pose_provider/agv1/base_pose_raw
      filtered_output_topic: /pose_provider/agv1/base_pose_filtered
      # Marker +Y points toward vehicle +X. The marker center is 187.89 mm
      # ahead of the drive-axle midpoint (base_link).
      tag_to_target_x: 0.0
      tag_to_target_y: -0.18789
      tag_to_target_yaw: 1.5707963267948966
    - entity_id: agv2
      enabled: true
      input_topic: /camera/world/agv2_tag_pose
      confidence_topic: /camera/world/agv2_confidence
      raw_output_topic: /pose_provider/agv2/base_pose_raw
      filtered_output_topic: /pose_provider/agv2/base_pose_filtered
      # Marker +Y points toward vehicle +X. The marker center is 88.19 mm
      # behind the drive-axle midpoint (base_link).
      tag_to_target_x: 0.0
      tag_to_target_y: 0.08819
      tag_to_target_yaw: 1.5707963267948966
    - entity_id: agv3
      enabled: true
      input_topic: /camera/world/agv3_tag_pose
      confidence_topic: /camera/world/agv3_confidence
      raw_output_topic: /pose_provider/agv3/base_pose_raw
      filtered_output_topic: /pose_provider/agv3/base_pose_filtered
      # Robot3 uses the same 88.19 mm rear-marker installation as Robot2.
      tag_to_target_x: 0.0
      tag_to_target_y: 0.08819
      tag_to_target_yaw: 1.5707963267948966
    - entity_id: load
      enabled: false
      input_topic: /camera/world/load_tag_pose
      confidence_topic: /camera/world/load_confidence
      raw_output_topic: /pose_provider/load/pose_raw
      filtered_output_topic: /pose_provider/load/pose_filtered
      tag_to_target_x: 0.0
      tag_to_target_y: 0.0
      tag_to_target_yaw: 0.0

projector:
  coarse_samples: 81
  maximum_refinement_iterations: 48
  convergence_tolerance: 1.0e-9
  maximum_projection_distance: 0.08

estimator:
  filter_alpha: 0.8
  projection_half_window: 0.35
  initial_progress: 0.0
  minimum_measurement_interval: 1.0e-5
  maximum_measurement_interval: 0.2
  maximum_absolute_speed: 0.5

robots:
  - robot_id: agv1
    robot_index: 1
    pose_topic: /pose_provider/agv1/base_pose_fused
    base_frame: agv1/base_link
    base_to_support: {x: -0.01783, y: 0.0, yaw: 0.0}
  - robot_id: agv2
    robot_index: 2
    pose_topic: /pose_provider/agv2/base_pose_fused
    base_frame: agv2/base_link
    base_to_support: {x: 0.09908, y: 0.0, yaw: 0.0}
  - robot_id: agv3
    robot_index: 3
    pose_topic: /pose_provider/agv3/base_pose_fused
    base_frame: agv3/base_link
    base_to_support: {x: 0.09908, y: 0.0, yaw: 0.0}
