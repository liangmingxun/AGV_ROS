formal_fake_runtime:
  schema_version: 1
  configuration_status: fake_only_algorithm_integration
  command_publication_authorized: true
  publish_rate: 100.0
  maximum_state_age: 0.15
  maximum_capability_age: 0.20
  require_valid_load_state: true
  # Keep false for standalone fake regression. Formal experiment launch must
  # override this to true so progress cannot begin before rosbag is armed.
  require_recorder_armed: false
  # Recorder publishes a 5 Hz heartbeat. Abrupt recorder loss therefore
  # returns the command path to fail-zero instead of trusting a stale latch.
  maximum_recorder_armed_age: 0.50
  initial_progress: 0.0
  target_progress: 1.0
  experiment_id: formal_algorithm_fake_integration

  leader:
    initial_position: 0.0
    velocity: 0.08
    acceleration: 0.0

  distributed_initial:
    position: [0.025, -0.018, 0.012]
    velocity: [0.080, 0.075, 0.085]
    auxiliary: [0.0, 0.0, 0.0]

  risk:
    capability_reserve: 0.015
    capability_safe_margin: 0.12
    input_safe_margin: 0.40
    wheel_safe_margin: 0.08
    position_limit: 0.12
    position_safe_margin: 0.06
    # Optional fifth causal risk input. Keep disabled for standalone golden
    # regression; approved physical orchestration should enable it.
    require_software_watchdog: false
    maximum_watchdog_age: 0.25

  capability_reserve:
    body_linear_velocity: 0.0
    body_angular_velocity: 0.0
    wheel_linear_velocity: 0.0
    path_acceleration: 0.0
    path_deceleration: 0.0

  lower:
    velocity_lower_bound: -0.15
    velocity_upper_bound: 0.58
    initial_parameter: [0.0, 0.0]
    initial_disturbance_estimate: 0.08

  tracker:
    longitudinal_gain: 1.0
    lateral_gain: 2.0
    heading_gain: 2.0
    chassis_reference_samples: 10001
    wheel_separation: [0.114, 0.114, 0.114]
    base_to_support:
      - {x: -0.01783, y: 0.0}
      - {x: -0.01783, y: 0.0}
      - {x: -0.01783, y: 0.0}
