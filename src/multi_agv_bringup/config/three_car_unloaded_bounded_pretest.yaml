# Dedicated authorization for the first unloaded three-car floor motion.
# This does not authorize the generic central controller or a loaded test.
three_car_unloaded_bounded_pretest:
  schema_version: 1
  configuration_status: camera_fused_centered_se2_formation_feedback_v1
  hardware_execution_authorized: true

  experiment_id: three_car_cooperative_camera_fused_s_1m
  method_id: CAMERA_IMU_WHEEL_FUSED_CLOSED_LOOP
  path_id: s_curve_1m_bounded
  validation_profile: camera_fused_s_1p00
  publish_rate: 100.0
  maximum_state_age: 0.15
  subscriber_wait_seconds: 15.0
  start_delay_seconds: 3.0
  stop_confirmation_timeout_seconds: 4.0
  stopped_wheel_tolerance: 0.01
  maximum_integration_step: 0.05
  maximum_motion_time: 30.0
  required_command_subscribers: 2
  readiness_stable_samples: 20
  initial_command_sequence: 41000

  motion:
    load_path_speed: 0.05
    target_progress: 1.00

  tracker:
    # The scalar values construct the common reference tracker. The arrays
    # below are the actual per-robot feedback/feedforward values used by this
    # validation node.
    longitudinal_gain: 1.0
    lateral_gain: 2.0
    heading_gain: 2.0
    longitudinal_gain_per_robot: [1.0, 1.0, 1.0]
    # Three-car S candidate v3 from camera runs 20260811_195606 and
    # 20260811_200917. Retain only Robot1's evidenced lateral improvement;
    # Robot2/3 return to their single-car frozen tracker values.
    lateral_gain_per_robot: [4.0, 3.0, 4.0]
    heading_gain_per_robot: [3.0, 2.5, 3.0]
    angular_feedforward_scale_positive: [0.78, 0.780810219, 0.850009371]
    angular_feedforward_scale_negative: [0.89, 0.918767785, 0.883228287]
    # Centred SE(2) feedback acts only on deformation relative to the fleet
    # mean. It strengthens Robot1-to-rear formation keeping without moving the
    # common virtual-load path reference.
    formation_longitudinal_gain: 0.25
    formation_lateral_gain: 0.50
    formation_heading_gain: 0.50
    # Robot1 previews only its weaker negative turn. Robot3's original
    # symmetric 0.05 s preview is restored with its frozen feedforward pair.
    curvature_preview_seconds_positive: [0.0, 0.0, 0.05]
    curvature_preview_seconds_negative: [0.05, 0.0, 0.05]
    chassis_reference_samples: 10001
    wheel_separation: [0.135484339, 0.139284482, 0.136802843]
    # drive-wheel axle midpoint (base_link) -> turntable centre (support_link)
    base_to_support:
      - {x: -0.01783, y: 0.0}
      - {x: -0.01783, y: 0.0}
      - {x: -0.01783, y: 0.0}

  abort:
    minimum_battery_voltage: 10.5
    # Cooperative localization remains capped at 0.15 s. Chassis feedback is
    # used for safety/status rather than geometric tracking; allow the
    # measured 0.16 s Wi-Fi delivery burst, but freeze the low-speed pretest
    # limit at 0.25 s. The chassis keeps its independent 0.20 s command
    # watchdog.
    maximum_feedback_receive_age: 0.25
    maximum_serial_feedback_age: 0.25
    maximum_stamp_spread: 0.02
    maximum_initial_load_progress: 0.03
    maximum_robot_progress_spread: 0.06
    maximum_load_progress_error: 0.08
    maximum_longitudinal_error: 0.08
    maximum_lateral_error: 0.06
    maximum_heading_error: 0.15
    maximum_wheel_linear_velocity: 0.08
