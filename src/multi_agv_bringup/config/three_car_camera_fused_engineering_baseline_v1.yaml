# Frozen engineering baseline for the unloaded three-car S validation.
#
# Scope:
#   - method: CAMERA_IMU_WHEEL_FUSED_CLOSED_LOOP
#   - three unloaded AGVs, 0.30 m equilateral support-centre formation
#   - 1.00 m S path at 0.05 m/s
#   - camera/IMU/wheel fused CooperativeState feedback
#
# This file is the comparison baseline for later M1+R1 and M2b trials.  It is
# not a paper-algorithm configuration and does not authorize a loaded test.
three_car_unloaded_bounded_pretest:
  schema_version: 1
  configuration_status: frozen_camera_imu_wheel_fused_engineering_baseline_v1
  baseline_id: CAMERA_IMU_WHEEL_FUSED_CLOSED_LOOP_V1
  method_role: engineering_baseline
  frozen_date: '2026-09-02'
  hardware_execution_authorized: true

  experiment_id: three_car_cooperative_camera_fused_s_1m
