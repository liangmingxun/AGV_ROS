# R=0.7 m clockwise circle with smooth curvature exit and terminal straight.
# Frozen on 2026-09-09 from the two valid 142241/142920 engineering runs.
# This configuration preserves the path, M1/R1 parameters and 0.08 m/s steady
# target. The method-shared serial execution adapter uses the same quintic
# start and transient-hold policy for M1, M2a and M2b comparisons.
