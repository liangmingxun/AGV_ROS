# Camera is the absolute SE(2) authority. Feed the adapter's causal filtered
# position into fusion so marker-plane vibration is attenuated before path
# projection and differentiation. The raw poses remain recorded for audit.
# Existing chassis odometry provides 100 Hz propagation between camera frames.
# Continue the 100 Hz fused output from wheel/IMU odometry through one short
# camera-confidence or delivery disturbance. The 20260909_135749 run measured
# a 0.225 s Robot3 fused-stream interruption after a single rejected frame;
# 0.30 s bridges that event without accepting an indefinitely camera-free run.
maximum_camera_age: 0.30
maximum_odometry_interval: 0.05
minimum_confidence: 0.5
position_measurement_weight: 0.8
heading_measurement_weight: 0.8

streams:
  - entity_id: agv1
    camera_pose_topic: /pose_provider/agv1/base_pose_filtered
    confidence_topic: /camera/world/agv1_confidence
    odometry_topic: /agv1/odom
    output_topic: /pose_provider/agv1/base_pose_fused
  - entity_id: agv2
    camera_pose_topic: /pose_provider/agv2/base_pose_filtered
    confidence_topic: /camera/world/agv2_confidence
    odometry_topic: /agv2/odom
    output_topic: /pose_provider/agv2/base_pose_fused
  - entity_id: agv3
    camera_pose_topic: /pose_provider/agv3/base_pose_filtered
    confidence_topic: /camera/world/agv3_confidence
    odometry_topic: /agv3/odom
    output_topic: /pose_provider/agv3/base_pose_fused
