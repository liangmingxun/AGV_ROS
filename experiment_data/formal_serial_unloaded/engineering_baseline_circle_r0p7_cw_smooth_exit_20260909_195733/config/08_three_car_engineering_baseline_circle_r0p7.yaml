# Engineering baseline on the same R=0.7 m clockwise circle used by M1+R1.
# This is not M1, M2a or M2b: there is no capability-driven upper reference
# generator and Robot2 derating is disabled.  The planar execution adapter,
# chassis calibration, localization and physical chassis limiters are shared.
