# External-paper lower-layer baseline for the normal M1 physical comparison.
# Hardware execution remains fail-closed; the runner creates a per-run operator
# authorization overlay after every physical confirmation is supplied.
formal_lower:
  schema_version: 1
  mode: PaperNM
  adaptation_enabled: false
  disturbance_compensation_enabled: false
  configuration_status: M1_REFERENCE_PAPER_EQUATION_13_LOWER_BASELINE
  algorithm_execution_authorized: true
  hardware_execution_authorized: false
  golden_vectors_verified: true
  update_rate: 100.0
  paper_nm:
    k1: 1.25
    k2: 2.75
  # Shared numerical/safety settings required by LowerChannelController.
  adaptation_gain: [0.0, 0.0]
  disturbance_adaptation_gain: 0.0
  parameter_leakage: 0.0
  disturbance_leakage: 0.0
  robust_boundary_layer: 0.055
  parameter_min: [0.0, 0.0]
  parameter_max: [0.0, 0.0]
  disturbance_estimate_max: 0.0
  constraint_margin: 0.00002
  sustained_saturation_seconds: 0.5
