# Experiment-level usable wheel capability. The chassis limiter enforces this
# value, CapabilityReport publishes it, and CapabilityMapper maps it into the
# common path-velocity boundary. The 0.9 m/s values below remain hardware/
# protocol nominal maxima rather than the capability offered to this run.
formal_available_wheel_limit: 0.08
nominal:
  max_wheel_linear_velocity_left: 0.9
  max_wheel_linear_velocity_right: 0.9
  max_wheel_linear_acceleration_left: 1.0
  max_wheel_linear_acceleration_right: 1.0
  max_wheel_linear_deceleration_left: 2.0
  max_wheel_linear_deceleration_right: 2.0
